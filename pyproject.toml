[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "restricted-content-downloader"
version = "0.1.0"
description = "A private Telegram bot for downloading accessible Telegram posts."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "Telethon==1.45.0",
    "psutil>=6,<8",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<2"]

[dependency-groups]
dev = ["ruff>=0.16,<0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
